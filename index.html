<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ROTAS EXTRAS</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>
    <h1>🚚 ROTAS EXTRAS</h1>

    <div class="desenvolvidoPor">
        Desenvolvido por <strong>Santiago Serra</strong>
        <span class="versaoSistema">LMA-02</span>
    </div>
</header>

    <main>

        <section class="formulario">

            <div class="campo">

                <label>
                    👨‍✈️ Motorista
                </label>

                <input
                    type="text"
                    id="buscarMotorista"
                    list="motoristas"
                    placeholder="Digite seu nome..."
                    autocomplete="off"
                >

                <datalist id="motoristas"></datalist>

            </div>

            <div class="campo">

                <label>
                    🏢 Agência
                </label>

                <select id="agencia">

                    <option value="">
                        Carregando...
                    </option>

                </select>

            </div>

        </section>

        <section class="rotas-section">

          <h2 id="tituloRotas">
    📦 Rotas Disponíveis
</h2>

<div class="campo-pesquisa">
    <input
        type="text"
        id="pesquisaBairro"
        placeholder="🔍 Pesquisar bairro..."
        onkeyup="filtrarBairros()"
    >
</div>

<div
    id="rotas"
    class="grid-rotas"
>

                <div class="card">

                    Carregando rotas...

                </div>

            </div>

        </section>

    </main>

    <footer>

        <p>
            LAM-02 © 2026
        </p>

    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>

</body>

</html>
